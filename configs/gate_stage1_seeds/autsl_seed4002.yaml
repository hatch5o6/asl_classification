# Top-K Independent Selection (48 points from best model)
save: /home/ccoulson/groups/grp_asl_classification/nobackup/archive/SLR/models/gate_stage1_seeds/seed4002
test_checkpoint: null
modalities: ["skeleton"]
joint_pruning: True

train_csv: data/train.csv
val_csv: data/val.csv
test_csv: data/test.csv
class_id_csv: data/SignList_ClassId_TR_EN.csv

seed: 4002
num_frames: video_mae
n_gpus: 2
device: cuda

# Learning rates
pretrained_learning_rate: 1e-04
new_learning_rate: 2e-04
skel_learning_rate: 2e-04
class_learning_rate: 2e-04
weight_decay: 0.01

# Training schedule
effective_batch_size: 64
early_stop: 1000
save_top_k: 10
val_interval: 0.25
max_steps: 40000

# Architecture
fusion_dim: 512
depth_image_size: 224
depth_hidden_dim: 384
depth_hidden_layers: 6
depth_att_heads: 6
depth_intermediate_size: 1536
depth_patch_size: 16

# BERT Skeleton Encoder
bert_hidden_layers: 2
bert_hidden_dim: 512
bert_att_heads: 8
bert_intermediate_size: 2048
bert_dropout: 0.0

# === L0 PRUNING SETTINGS ===
num_pose_points: 543
joint_indices_file: null
init_keep_probability: 0.5
use_random_init: false

# L0 annealing schedule
l0_warmup_steps: 0
l0_anneal_steps: 5000
l0_end_weight: 2.0

# Temperature annealing
temp_start: 10.0
temp_end: 0.01
temp_anneal_steps: 50000

classifier_dropout: 0.2
gradient_clip_val: 1.0
gate_type: hard_concrete
cache_val_skeletons: true

# Stage-1 ranking stability. Every stage-2 result uses a single stage-1 ranking per
# language (seed 4000), so the ranking itself -- the method's actual product -- has had
# no variance estimate. Seeds 4001/4002 measure seed sensitivity; the seed-4000 rerun
# measures same-seed run-to-run nondeterminism, the floor any seed effect must exceed.
# Config otherwise identical to the run that produced the published ranking.
