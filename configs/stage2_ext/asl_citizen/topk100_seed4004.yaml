# Top-K Independent Selection (48 points, ASL Citizen)
save: /home/ccoulson/groups/grp_asl_classification/nobackup/archive/SLR/models/asl_citizen/stage2_ext/topk100_seed4004
test_checkpoint: null
modalities: ["skeleton"]
joint_pruning: False

train_csv: data/asl_citizen/train.csv
val_csv: data/asl_citizen/val.csv
test_csv: data/asl_citizen/test.csv
class_id_csv: data/asl_citizen/class_ids.csv

seed: 4004
num_frames: video_mae
n_gpus: 1
device: cuda

# Learning rates
pretrained_learning_rate: 1e-04
new_learning_rate: 2e-04
skel_learning_rate: 2e-04
class_learning_rate: 2e-04
weight_decay: 0.01

# Training schedule
effective_batch_size: 64
early_stop: 30
save_top_k: 10
val_interval: 0.25
max_steps: 80000

# Architecture
fusion_dim: 512
depth_image_size: 224
depth_hidden_dim: 384
depth_hidden_layers: 6
depth_att_heads: 6
depth_intermediate_size: 1536
depth_patch_size: 16

# BERT Skeleton Encoder
bert_hidden_layers: 2
bert_hidden_dim: 512
bert_att_heads: 8
bert_intermediate_size: 2048
bert_dropout: 0.1

# === L0 PRUNING SETTINGS ===
num_pose_points: 100
joint_indices_file: data/asl_citizen/informed_selection_hc/topk/top_100_indices.json
init_keep_probability: 0.5
use_random_init: false

# L0 annealing schedule
l0_warmup_steps: 0
l0_anneal_steps: 5000
l0_end_weight: 2.0

# Temperature annealing
temp_start: 10.0
temp_end: 0.01
temp_anneal_steps: 50000

classifier_dropout: 0.2
label_smoothing: 0.1
gradient_clip_val: 1.0
gate_type: hard_concrete
cache_val_skeletons: true

# Standardize each MediaPipe anatomical group to unit variance instead of pooling
# statistics over all 543 landmarks. Removes the ~13x raw amplitude advantage that
# pose landmarks hold over face landmarks, so the L0 gate compares landmarks by
# their own variation rather than by absolute motion magnitude.
normalization_scope: global

# Stage-2 top-100 (asl_citizen), seed 4000. Hard-concrete gate ranking.

# Extended-budget re-run. 38 of 50 ASL Citizen stage-2 runs hit the 40,000-step cap
# still improving, while the TSLFormer baseline early-stopped on its own at 32k-39k.
# Raising the cap to 80,000 lets early stopping (patience 30) decide, as it already does
# on AUTSL and GSL, so the external comparison is not skewed by our own budget.

# Seeds 4-5: AUTSL K=48 sat at p=0.0513 on test with the largest effect in the paper.
