# Full 543-point baseline with learned joint pruning (GSL - Greek Sign Language)
# Matches asl_citizen/s architecture — use this to generate topk joint indices.
save: /home/ccoulson/groups/grp_asl_classification/nobackup/archive/SLR/models/gsl/stage2_hc/matchrand24_draw1
test_checkpoint: null
modalities: ["skeleton"]
joint_pruning: False

train_csv: data/gsl/train.csv
val_csv: data/gsl/val.csv
test_csv: data/gsl/test.csv
class_id_csv: data/gsl/class_ids.csv

seed: 4000
num_frames: video_mae
n_gpus: 1
device: cuda

# Learning rates
pretrained_learning_rate: 1e-04
new_learning_rate: 2e-04
skel_learning_rate: 2e-04
class_learning_rate: 2e-04
weight_decay: 0.01

# Training schedule
effective_batch_size: 64
early_stop: 30
save_top_k: 10
val_interval: 0.25
max_steps: 40000

# Architecture
fusion_dim: 512
depth_image_size: 224
depth_hidden_dim: 384
depth_hidden_layers: 6
depth_att_heads: 6
depth_intermediate_size: 1536
depth_patch_size: 16

# BERT Skeleton Encoder
bert_hidden_layers: 2
bert_hidden_dim: 512
bert_att_heads: 8
bert_intermediate_size: 2048
bert_dropout: 0.0

# L0 joint pruning
num_pose_points: 24
init_keep_probability: 0.5

# L0 annealing schedule
l0_warmup_steps: 0
l0_anneal_steps: 5000
l0_end_weight: 2.0

# Temperature annealing
temp_start: 10.0
temp_end: 0.01
temp_anneal_steps: 50000

classifier_dropout: 0.2
gradient_clip_val: 1.0
gate_type: hard_concrete

# Memoize the (deterministic, un-augmented) validation clips in RAM. On ASL Citizen
# validation is 51%% of all clip preprocessing; ~60 MB cache, bit-identical output.
cache_val_skeletons: true

# Standardize each MediaPipe anatomical group to unit variance instead of pooling
# statistics over all 543 landmarks. Removes the ~13x raw amplitude advantage that
# pose landmarks hold over face landmarks, so the L0 gate compares landmarks by
# their own variation rather than by absolute motion magnitude.
normalization_scope: global
joint_indices_file: data/region_subsets/matched_random/gsl_k24_draw1.json

# Random-48 baseline draw 0 (gsl). Draws shared across languages.

# Composition-matched random baseline, K=24, draw 1. Matches the learned top-24
# subset's face/body/left-hand/right-hand counts exactly ({'face': 0, 'body': 7, 'LH': 2, 'RH': 15}) and randomizes WHICH
# landmarks are taken within each group. Uniform random-K at small K mostly tests whether
# a draw includes any hands (44% of uniform K=10 draws contain none); this isolates the
# fine-grained ranking from the coarse anatomical choice.
